<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cherif Tas - Digital OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --background-image-url: url('https://images.unsplash.com/photo-1550684376-ef16af215983?q=80&w=2070&auto=format&fit=crop');
            --window-bg: rgba(10, 20, 35, 0.7);
            --border-color: rgba(100, 220, 255, 0.3);
            --header-bg: rgba(40, 50, 65, 0.8);
            --accent-glow: 0 0 15px rgba(0, 255, 255, 0.3);
        }
        body { font-family: 'Space Grotesk', sans-serif; background-color: #0a1423; background-image: var(--background-image-url); background-size: cover; background-position: center; overflow: hidden; color: #e0e0e0; }
        #desktop { width: 100vw; height: 100vh; position: relative; }
        .window { position: absolute; background: var(--window-bg); backdrop-filter: blur(16px) saturate(180%); -webkit-backdrop-filter: blur(16px) saturate(180%); border: 1px solid var(--border-color); border-radius: 12px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37), var(--accent-glow); display: none; flex-direction: column; resize: both; overflow: hidden; transition: opacity 0.3s ease, transform 0.3s ease, width 0.3s ease, height 0.3s ease; transform-origin: center; }
        .window.open { display: flex; animation: open-window 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .window.minimized { display: none; }
        @keyframes open-window { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        .window-header { background-color: var(--header-bg); color: #fff; padding: 8px 12px; cursor: move; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); user-select: none; }
        .window-title { font-family: 'Roboto Mono', monospace; font-weight: 700; }
        .window-controls { display: flex; gap: 6px; }
        .control-btn { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.2); cursor: pointer; }
        .close-btn { background-color: #ff5f56; }
        .minimize-btn { background-color: #ffbd2e; }
        .maximize-btn { background-color: #27c93f; }
        .window-content { padding: 20px; overflow-y: auto; flex-grow: 1; }
        .window-content::-webkit-scrollbar { width: 8px; }
        .window-content::-webkit-scrollbar-track { background: transparent; }
        .window-content::-webkit-scrollbar-thumb { background-color: rgba(0, 255, 255, 0.4); border-radius: 10px; border: 2px solid transparent; background-clip: content-box; }
        .window-content::-webkit-scrollbar-thumb:hover { background-color: rgba(0, 255, 255, 0.6); }
        #icon-grid { position: absolute; top: 80px; left: 30px; display: grid; grid-template-columns: 1fr; gap: 20px; }
        .desktop-icon { display: flex; flex-direction: column; align-items: center; text-align: center; cursor: pointer; padding: 10px; border-radius: 8px; transition: background-color 0.2s, transform 0.2s; width: 90px; }
        .desktop-icon:hover { background-color: rgba(100, 220, 255, 0.1); transform: scale(1.05); }
        .desktop-icon svg { width: 48px; height: 48px; margin-bottom: 8px; filter: drop-shadow(var(--accent-glow)); }
        .desktop-icon span { font-size: 14px; text-shadow: 1px 1px 3px rgba(0,0,0,0.5); }
        #taskbar { position: absolute; top: 0; left: 0; width: 100%; height: 40px; background: rgba(10, 20, 35, 0.5); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; padding: 0 20px; z-index: 1000; }
        .taskbar-brand { font-weight: bold; letter-spacing: 1px; flex-shrink: 0; }
        #taskbar-apps { flex-grow: 1; display: flex; justify-content: flex-start; align-items: center; gap: 8px; padding: 0 20px; }
        .taskbar-app { background: rgba(100, 220, 255, 0.1); border: 1px solid transparent; color: #e0e0e0; padding: 4px 10px; border-radius: 6px; font-size: 13px; cursor: pointer; transition: all 0.2s; }
        .taskbar-app:hover { background: rgba(100, 220, 255, 0.2); border-color: rgba(100, 220, 255, 0.3); }
        .taskbar-app.minimized { background: rgba(100, 220, 255, 0.05); color: #888; }
        #clock { font-family: 'Roboto Mono', monospace; font-size: 14px; color: #00ffff; text-shadow: var(--accent-glow); flex-shrink: 0; }
        #terminal-content { background: #000; color: #0f0; font-family: 'Roboto Mono', monospace; padding: 10px; }
        #terminal-output p { margin-bottom: 5px; white-space: pre-wrap; }
        #terminal-output .prompt { color: #00ffff; }
        #terminal-input { color: #0f0; }
        @media (max-width: 768px) {
            #icon-grid { top: 60px; left: 0; right: 0; width: 100%; padding: 10px; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); justify-content: center; gap: 10px; }
            .window { width: 95vw !important; height: 80vh !important; top: 50px !important; left: 2.5vw !important; resize: none; }
        }
    </style>
</head>
<body>
    <div id="desktop">
        <header id="taskbar"><div class="taskbar-brand">CherifOS</div><div id="taskbar-apps"></div><div id="clock"></div></header>
        <div id="icon-grid"></div>

        <!-- Window Templates -->
        <div id="about-window" class="window" style="width: 600px; height: 450px; top: 100px; left: 150px;">
            <div class="window-header"><span class="window-title">About_Me.txt</span><div class="window-controls"><span class="control-btn close-btn"></span><span class="control-btn minimize-btn"></span><span class="control-btn maximize-btn"></span></div></div>
            <div class="window-content flex flex-col items-center text-center"></div>
        </div>
        <div id="skills-window" class="window" style="width: 700px; height: 550px; top: 180px; left: 250px;">
            <div class="window-header"><span class="window-title">/Skills</span><div class="window-controls"><span class="control-btn close-btn"></span><span class="control-btn minimize-btn"></span><span class="control-btn maximize-btn"></span></div></div>
            <div class="window-content space-y-6"></div>
        </div>
        <div id="projects-window" class="window" style="width: 800px; height: 600px; top: 120px; left: 350px;">
            <div class="window-header"><span class="window-title">/Projects</span><div class="window-controls"><span class="control-btn close-btn"></span><span class="control-btn minimize-btn"></span><span class="control-btn maximize-btn"></span></div></div>
            <div class="window-content"><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="projects-grid"></div></div>
        </div>
        <div id="experience-window" class="window" style="width: 650px; height: 500px; top: 150px; left: 400px;">
            <div class="window-header"><span class="window-title">/Experience</span><div class="window-controls"><span class="control-btn close-btn"></span><span class="control-btn minimize-btn"></span><span class="control-btn maximize-btn"></span></div></div>
            <div class="window-content space-y-6" id="experience-content"></div>
        </div>
        <div id="achievements-window" class="window" style="width: 750px; height: 650px; top: 80px; left: 200px;">
            <div class="window-header"><span class="window-title">/Achievements</span><div class="window-controls"><span class="control-btn close-btn"></span><span class="control-btn minimize-btn"></span><span class="control-btn maximize-btn"></span></div></div>
            <div class="window-content space-y-8" id="achievements-content"></div>
        </div>
        <div id="contact-window" class="window" style="width: 400px; height: 300px; top: 250px; left: 450px;">
            <div class="window-header"><span class="window-title">Contact.sh</span><div class="window-controls"><span class="control-btn close-btn"></span><span class="control-btn minimize-btn"></span><span class="control-btn maximize-btn"></span></div></div>
            <div class="window-content flex flex-col justify-center items-center space-y-4" id="contact-content"></div>
        </div>
        <div id="terminal-window" class="window" style="width: 700px; height: 450px; top: 200px; left: 300px;">
            <div class="window-header"><span class="window-title">/bin/bash</span><div class="window-controls"><span class="control-btn close-btn"></span><span class="control-btn minimize-btn"></span><span class="control-btn maximize-btn"></span></div></div>
            <div id="terminal-content" class="window-content">
                <div id="terminal-output"></div>
                <div class="flex mt-2">
                    <span class="text-cyan-400">cherif@os:~$</span>
                    <input type="text" id="terminal-input" class="flex-grow bg-transparent border-none outline-none pl-2">
                </div>
            </div>
        </div>
    </div>
<script>
document.addEventListener('DOMContentLoaded', function () {
    const desktop = document.getElementById('desktop');
    const taskbarAppsContainer = document.getElementById('taskbar-apps');
    let zIndexCounter = 10;

    const portfolioData = { // All data is here...
        user: { name: "Cherif Tas", title: "AI Technology Analyst & Implementation Specialist", professionalSummary: "Multidisciplinary student passionate about building intelligent systems. My journey started with ethical hacking and evolved into UI design, web development, and applied AI. I specialize in AI tool analysis, prompt engineering, and creating solutions like chatbots and data scrapers. I merge technical skills with philosophical analysis to approach problems from unique angles.", avatar: "https://v3.fal.media/files/tiger/tDZLgN1AEWiwK4Dj05-T4_f05e86f1c78745a68c7c88de1232850c.png" },
        contact: { email: "cheriftas20042004@gmail.com", linkedin: "https://www.linkedin.com/in/cherif-tas-7504b8319" },
        skills: {
            languages: [ { name: "HTML5/CSS3", level: 8 }, { name: "TypeScript", level: 7 }, { name: "Python", level: 6 }, { name: "JavaScript", level: 5 }, { name: "SQL", level: 5 } ],
            frameworks: ["React.js", "Node.js", "Express.js", "TensorFlow", "Flask", "Pandas", "NumPy"],
            aiTools: ["Gemini API", "Gradio", "Hugging Face", "ChatGPT", "Claude"],
            other: ["UI/UX Design", "Responsive Design", "Cybersecurity", "Project Management", "Technical Writing", "Public Speaking", "Video Editing", "Graphic Design"]
        },
        projects: [
            { title: "ENSTPStudy Platform", desc: "Centralized platform for ENSTP students with complete resources.", link: "https://prlt.vercel.app/" },
            { title: "Algeria Intel Agent", desc: "Tool that hunts verified Algerian companies, providing clean, exportable data.", link: "https://inteldz.vercel.app" },
            { title: "AI Tutor Chatbot", desc: "AI-powered chatbot offering a personalized, interactive way to learn about AI.", link: "https://lnkd.in/eRMps-Yk" },
        ],
        experience: [
            { role: "AI Technology Analyst & Implementation Specialist", company: "Freelance", period: "2023 - Present", desc: "Analyze and compare AI tools to identify optimal applications and develop custom AI solutions." },
            { role: "UI Developer", company: "LTP Club", period: "2023 - Present", desc: "Design and develop websites and digital assets for club events and initiatives." },
        ],
        achievements: {
            competitions: [ { name: "National AI Competition", place: "4th Place", year: 2023, img: "https://media.licdn.com/dms/image/v2/D5622AQEkPvTU3w7aYQ/feedshare-shrink_800/B56ZY_zP.tH0Ag-/0/1744827548137?e=1759968000&v=beta&t=YQ6SO87ToiBID26se8usxzmADP3w8ehldHzFEjXrNWg" } ],
            publications: [ { title: "بين ضفاف الوعي والجنون", type: "Philosophical Storybook", year: 2025, link: "https://drive.google.com/file/d/1U-2bEFVpx-bzWCj9aMqjzn-TPxRqQOGP/view?usp=drivesdk" } ],
            certifications: ["Certified Project Management Associate", "Certified Critical Infrastructure Protection Specialist", "Machine Learning and Artificial Intelligence (HP)"]
        }
    };

    // --- Clock ---
    const clockElement = document.getElementById('clock');
    function updateClock() {
        const now = new Date();
        const options = { timeZone: 'Africa/Algiers', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
        clockElement.textContent = now.toLocaleTimeString('en-US', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // --- Content Population ---
    function populateContent() {
        const createTag = (text) => `<span class="bg-gray-700/60 text-cyan-300 text-xs font-mono font-medium px-2 py-1 rounded">${text}</span>`;
        // About
        document.querySelector('#about-window .window-content').innerHTML = `<img src="${portfolioData.user.avatar}" class="h-32 w-32 object-cover rounded-full mb-4 border-2 border-cyan-400 p-1" alt="${portfolioData.user.name}"><h2 class="text-2xl font-bold text-cyan-300">${portfolioData.user.name}</h2><p class="text-md text-gray-300 mb-4">${portfolioData.user.title}</p><p class="text-gray-400 text-sm leading-relaxed">${portfolioData.user.professionalSummary}</p>`;
        // Skills
        document.querySelector('#skills-window .window-content').innerHTML = `<div><h3 class="font-bold text-cyan-300 mb-2">// Programming Languages</h3><div class="space-y-3">${portfolioData.skills.languages.map(s => `<div class="w-full"><span class="text-sm font-mono text-gray-300">${s.name}</span><div class="w-full bg-gray-700/50 rounded-full h-2 mt-1"><div class="bg-gradient-to-r from-cyan-500 to-blue-500 h-2 rounded-full" style="width: ${s.level * 10}%"></div></div></div>`).join('')}</div></div><div><h3 class="font-bold text-cyan-300 mb-2">// Frameworks & Libraries</h3><div class="flex flex-wrap gap-2">${portfolioData.skills.frameworks.map(createTag).join('')}</div></div><div><h3 class="font-bold text-cyan-300 mb-2">// AI Tools & Platforms</h3><div class="flex flex-wrap gap-2">${portfolioData.skills.aiTools.map(createTag).join('')}</div></div><div><h3 class="font-bold text-cyan-300 mb-2">// Other Expertise</h3><div class="flex flex-wrap gap-2">${portfolioData.skills.other.map(createTag).join('')}</div></div>`;
        // Projects
        document.getElementById('projects-grid').innerHTML = portfolioData.projects.map(p => `<a href="${p.link}" target="_blank" class="block bg-gray-800/50 p-4 rounded-lg hover:bg-gray-700/70 transition-colors border border-transparent hover:border-cyan-400/50"><h4 class="font-bold text-white">${p.title}</h4><p class="text-sm text-gray-400 mt-1">${p.desc}</p></a>`).join('');
        // Experience
        document.getElementById('experience-content').innerHTML = portfolioData.experience.map(e => `<div class="border-l-2 border-cyan-400/50 pl-4 mb-6"><p class="text-sm text-gray-400">${e.period}</p><h4 class="font-bold text-lg text-white">${e.role}</h4><p class="text-sm font-mono text-cyan-300 mb-2">${e.company}</p><p class="text-gray-400 text-sm">${e.desc}</p></div>`).join('');
        // Achievements
        document.getElementById('achievements-content').innerHTML = `<div><h3 class="font-bold text-cyan-300 mb-4 text-xl">// Competitions & Publications</h3><div class="grid grid-cols-1 md:grid-cols-3 gap-4">${portfolioData.achievements.competitions.map(c => `<div class="bg-gray-800/50 p-3 rounded-lg text-center"><img src="${c.img}" class="w-full h-32 object-cover rounded-md mb-2"><h5 class="font-bold">${c.name}</h5><p class="text-sm text-cyan-300">${c.place || c.project}</p></div>`).join('')}${portfolioData.achievements.publications.map(p => `<div class="bg-gray-800/50 p-3 rounded-lg flex flex-col justify-center text-center"><h5 class="font-bold">${p.title}</h5><p class="text-sm text-cyan-300">${p.type}</p><a href="${p.link}" target="_blank" class="text-sm mt-4 bg-cyan-600/50 hover:bg-cyan-600/80 py-1 px-2 rounded">Read More</a></div>`).join('')}</div></div><div><h3 class="font-bold text-cyan-300 mb-2 text-xl">// Certifications</h3><div class="flex flex-wrap gap-2">${portfolioData.achievements.certifications.map(c => createTag(c)).join('')}</div></div>`;
        // Contact
        document.getElementById('contact-content').innerHTML = `<a href="mailto:${portfolioData.contact.email}" class="bg-cyan-600/50 hover:bg-cyan-600/80 text-white font-bold py-3 px-6 rounded-lg w-full text-center transition-colors">Email Me</a><a href="${portfolioData.contact.linkedin}" target="_blank" class="bg-blue-600/50 hover:bg-blue-600/80 text-white font-bold py-3 px-6 rounded-lg w-full text-center transition-colors">LinkedIn Profile</a>`;
    }

    // --- Desktop Icons ---
    const icons = [
        { id: 'about', name: 'About Me', svg: '<svg class="text-cyan-300" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/></svg>' },
        { id: 'skills', name: 'Skills', svg: '<svg class="text-green-300" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>' },
        { id: 'projects', name: 'Projects', svg: '<svg class="text-yellow-300" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>' },
        { id: 'experience', name: 'Experience', svg: '<svg class="text-orange-300" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>' },
        { id: 'achievements', name: 'Achievements', svg: '<svg class="text-red-300" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V2L8 6l4 4V2z"/><path d="M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/><path d="M12 22l4-4-4-4v8z"/></svg>' },
        { id: 'terminal', name: 'Terminal', svg: '<svg class="text-lime-300" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>' },
        { id: 'contact', name: 'Contact', svg: '<svg class="text-purple-300" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>' },
    ];

    const iconGrid = document.getElementById('icon-grid');
    icons.forEach(icon => {
        const iconEl = document.createElement('div');
        iconEl.className = 'desktop-icon';
        iconEl.dataset.windowId = `${icon.id}-window`;
        iconEl.innerHTML = `${icon.svg}<span>${icon.name}</span>`;
        iconGrid.appendChild(iconEl);
        iconEl.addEventListener('dblclick', () => openWindow(document.getElementById(iconEl.dataset.windowId)));
    });

    // --- Window Management ---
    function openWindow(win) {
        if (!win) return;
        if (!win.classList.contains('open')) {
            win.classList.remove('minimized');
            win.classList.add('open');
        }
        win.style.zIndex = ++zIndexCounter;
        createTaskbarIcon(win);
    }

    function createTaskbarIcon(win) {
        const winId = win.id;
        if (document.querySelector(`.taskbar-app[data-window-id="${winId}"]`)) return;
        const appIcon = document.createElement('button');
        appIcon.className = 'taskbar-app';
        appIcon.dataset.windowId = winId;
        appIcon.textContent = win.querySelector('.window-title').textContent;
        appIcon.addEventListener('click', () => {
            if (win.classList.contains('minimized')) {
                openWindow(win);
                appIcon.classList.remove('minimized');
            } else {
                win.style.zIndex = ++zIndexCounter;
            }
        });
        taskbarAppsContainer.appendChild(appIcon);
    }

    const windows = document.querySelectorAll('.window');
    windows.forEach(win => {
        const header = win.querySelector('.window-header');
        const closeBtn = win.querySelector('.close-btn');
        const minimizeBtn = win.querySelector('.minimize-btn');
        const maximizeBtn = win.querySelector('.maximize-btn');

        function onDrag({ movementX, movementY }) { if (win.dataset.isMaximized !== 'true') { let style = window.getComputedStyle(win); win.style.top = `${parseInt(style.top) + movementY}px`; win.style.left = `${parseInt(style.left) + movementX}px`; } }
        header.addEventListener('mousedown', () => { win.style.zIndex = ++zIndexCounter; header.addEventListener('mousemove', onDrag); });
        document.addEventListener('mouseup', () => { header.removeEventListener('mousemove', onDrag); });
        win.addEventListener('mousedown', () => { win.style.zIndex = ++zIndexCounter; });

        closeBtn.addEventListener('click', (e) => { e.stopPropagation(); win.classList.remove('open'); const taskbarIcon = document.querySelector(`.taskbar-app[data-window-id="${win.id}"]`); if (taskbarIcon) taskbarIcon.remove(); });
        minimizeBtn.addEventListener('click', (e) => { e.stopPropagation(); win.classList.add('minimized'); win.classList.remove('open'); const taskbarIcon = document.querySelector(`.taskbar-app[data-window-id="${win.id}"]`); if (taskbarIcon) taskbarIcon.classList.add('minimized'); });

        maximizeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            win.style.transition = 'width 0.3s ease, height 0.3s ease, top 0.3s ease, left 0.3s ease';
            if (win.dataset.isMaximized === 'true') {
                win.style.width = win.dataset.oldWidth; win.style.height = win.dataset.oldHeight; win.style.top = win.dataset.oldTop; win.style.left = win.dataset.oldLeft; win.dataset.isMaximized = 'false';
            } else {
                win.dataset.oldWidth = win.style.width; win.dataset.oldHeight = win.style.height; win.dataset.oldTop = win.style.top; win.dataset.oldLeft = win.style.left;
                win.style.width = '100vw'; win.style.height = 'calc(100vh - 40px)'; win.style.top = '40px'; win.style.left = '0'; win.dataset.isMaximized = 'true';
            }
            setTimeout(() => { win.style.transition = 'opacity 0.3s ease, transform 0.3s ease, width 0.3s ease, height 0.3s ease'; }, 300);
        });
    });

    // --- Terminal ---
    const terminalWindow = document.getElementById('terminal-window');
    const terminalOutput = document.getElementById('terminal-output');
    const terminalInput = document.getElementById('terminal-input');
    let commandHistory = [];
    let historyIndex = -1;

    terminalWindow.addEventListener('click', () => terminalInput.focus());
    terminalInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            const command = terminalInput.value.trim();
            if (command) {
                commandHistory.push(command);
                historyIndex = commandHistory.length;
                processCommand(command);
                terminalInput.value = '';
            }
        } else if (e.key === 'ArrowUp') {
            if (historyIndex > 0) {
                historyIndex--;
                terminalInput.value = commandHistory[historyIndex];
            }
        } else if (e.key === 'ArrowDown') {
            if (historyIndex < commandHistory.length - 1) {
                historyIndex++;
                terminalInput.value = commandHistory[historyIndex];
            } else {
                historyIndex = commandHistory.length;
                terminalInput.value = '';
            }
        }
    });

    function printToTerminal(text, isPrompt = false) {
        const p = document.createElement('p');
        if (isPrompt) {
            p.innerHTML = `<span class="prompt">cherif@os:~$</span> ${text}`;
        } else {
            p.textContent = text;
        }
        terminalOutput.appendChild(p);
        terminalOutput.parentElement.scrollTop = terminalOutput.parentElement.scrollHeight;
    }

    function processCommand(command) {
        printToTerminal(command, true);
        const [cmd, ...args] = command.split(' ');
        switch (cmd) {
            case 'help':
                printToTerminal('Available commands: help, ls, cat, open, neofetch, clear');
                break;
            case 'ls':
                printToTerminal('about.txt  skills/  projects/  experience/  achievements/  contact.sh');
                break;
            case 'cat':
                if (args[0] === 'about.txt') printToTerminal(portfolioData.user.professionalSummary);
                else printToTerminal(`cat: ${args[0]}: No such file or directory`);
                break;
            case 'open':
                const winId = `${args[0]}-window`;
                const winToOpen = document.getElementById(winId);
                if (winToOpen) openWindow(winToOpen);
                else printToTerminal(`open: could not open application '${args[0]}'`);
                break;
            case 'neofetch':
                printToTerminal(`
    _______  __   __  ______    _______  ______   _______  _______
   |       ||  | |  ||    _ |  |       ||      | |   _   ||       |
   |    ___||  |_|  ||   | ||  |    ___||  _    ||  |_|  ||    ___|
   |   |___ |       ||   |_||_ |   |___ | | |   ||       ||   |___
   |    ___||       ||    __  ||    ___|| |_|   ||       ||    ___|
   |   |    |   _   ||   |  | ||   |___ |       ||   _   ||   |___
   |___|    |__| |__||___|  |_||_______||______| |__| |__||_______|
   ---------------------------------------------------------------
   OS: CherifOS v1.0
   Host: Web Browser
   Kernel: JavaScript
   Uptime: ${Math.floor(performance.now()/1000)}s
   Shell: /bin/bash
   Resolution: ${window.innerWidth}x${window.innerHeight}
   CPU: (1) Your Brain
   GPU: Browser Rendering Engine
   Memory: A few MBs of RAM
                `);
                break;
            case 'clear':
                terminalOutput.innerHTML = '';
                break;
            default:
                printToTerminal(`command not found: ${cmd}`);
        }
    }

    // --- Init ---
    populateContent();
    printToTerminal("Welcome to CherifOS. Type 'help' to see available commands.");
    setTimeout(() => openWindow(document.getElementById('about-window')), 500);
});
</script>
